# Department Proxy Policies

http_port 3129
http_port 3130
http_port 3131

acl employee_device src 192.168.50.10

acl it_port localport 3129
acl hr_port localport 3130
acl finance_port localport 3131

acl it_allowed dstdomain "/etc/squid/policies/it_allowed"
acl it_blocked dstdomain "/etc/squid/policies/it_blocked"
acl hr_allowed dstdomain "/etc/squid/policies/hr_allowed"
acl finance_allowed dstdomain "/etc/squid/policies/finance_allowed"
http_access deny it_port employee_device employee_authenticated it_blocked
http_access allow it_port employee_device employee_authenticated it_allowed
http_access deny it_port

http_access allow hr_port employee_device employee_authenticated hr_allowed
http_access deny hr_port

http_access allow finance_port employee_device employee_authenticated finance_allowed
http_access deny finance_port
